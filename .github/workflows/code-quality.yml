name: Code Quality Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  batmanuel:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Analyze repository
        run: npx ts-node src/bin/cli.ts analyze . > batmanuel-report.json

      - name: Check quality gate
        run: |
          jq -e '.passed == true' batmanuel-report.json > /dev/null
          echo "Batmanuel quality gate passed."

      - name: Build package
        run: npm run build && node scripts/fix-dist-package.cjs

      - name: Publish package on NPM
        working-directory: dist/
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
